<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petite URL (URL Shortener)</title>

    <link rel="stylesheet" href="style.css" />

    <script src="client.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="header">Petite URL (URL Shortener)</div>

      <div class="input-area">
        <input
          type="text"
          id="longURLInput"
          placeholder="Long URL..."
          autocomplete="off"
        />
        <button id="shortenBtn">Shorten</button>
      </div>

      <div class="output-area" id="outputArea">
        <!-- Short URL Outputs here, with copy button-->
      </div>

      <div class="header" id="historyHeader">History</div>

      <div class="history-area" id="historyArea">
        (Additional Optional Feature)<br />History has a scroll down for
        overflow <br />
        History shows the long and short URL pair<br />True history uses the
        browser's cache/cookies
      </div>
    </div>
  </body>
</html>
